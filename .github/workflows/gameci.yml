name: GameCI

# on: [push, pull_request]
on:
  workflow_dispatch:

jobs:
  test:
    # name: Test in ${{ matrix.testMode }}
    name: Test in EditMode
    runs-on: ubuntu-latest
    # strategy:
    #   fail-fast: false
    #   matrix:
    #     testMode:
    #       - playmode
    #       - editmode
    #       - standalone
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ci_checkout
          lfs: true

      - name: Prepare project
        run: |
          mv ci_checkout/.github/unity/unity-2022.3.22f1/* . && \
          mkdir -p Packages/dev.limitex.mono-ui && \
          mv ci_checkout/* Packages/dev.limitex.mono-ui/ && \
          rm -rf ci_checkout

      - name: Setup vrc-get
        uses: anatawa12/sh-actions/setup-vrc-get@master

      - name: Resolve VPM packages
        uses: anatawa12/sh-actions/resolve-vpm-packages@master
        with:
          repos: |
            https://vpm.limitex.dev/
      
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library
          restore-keys: Library
            
      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        id: gameci
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          unityVersion: 2022.3.6f1
          githubToken: ${{ github.token }}
          coverageOptions: generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+dev.limitex.*
          customParameters: -assemblyNames Tests
          # checkName: ${{ matrix.testMode }} Test Results
          checkName: EditMode Test Results
        
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # name: Test results (${{ matrix.testMode }})
          name: Test results (EditMode)
          path: ${{ steps.gameci.outputs.artifactsPath }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # name: Coverage results (${{ matrix.testMode }})
          name: Coverage results (EditMode)
          path: ${{ steps.gameci.outputs.coveragePath }}
