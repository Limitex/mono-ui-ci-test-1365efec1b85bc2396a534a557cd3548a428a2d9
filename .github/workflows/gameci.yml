name: GameCI

# on: [push, pull_request]
on:
  workflow_dispatch:

jobs:
  test:
    name: Test in ${{ matrix.testMode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - playmode
          # - editmode
          # - standalone
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ci_checkout
          lfs: true
      - name: Checkout test project
        run: |
          mv ci_checkout/.github/unity/unity-2022.3.22f1/* . && \
          mkdir -p Packages/dev.limitex.mono-ui && \
          mv ci_checkout/* Packages/dev.limitex.mono-ui/ && \
          rm -rf ci_checkout

      - name: Setup vrc-get
        uses: anatawa12/sh-actions/setup-vrc-get@master

      - name: Resolve VPM packages
        uses: anatawa12/sh-actions/resolve-vpm-packages@master
        with:
          repos: |
            https://vpm.limitex.dev/
      
      - name: Install Project Dependencies
        run: vrc-get install -y com.vrchat.worlds

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library
          restore-keys: Library
            
      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        id: gameci
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ github.token }}
          checkName: ${{ matrix.testMode }} Test Results
        
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results (${{ matrix.testMode }})
          path: ${{ steps.gameci.outputs.artifactsPath }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Coverage results (${{ matrix.testMode }})
          path: ${{ steps.gameci.outputs.coveragePath }}
