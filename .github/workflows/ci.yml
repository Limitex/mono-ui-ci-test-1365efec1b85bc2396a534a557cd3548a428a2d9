name: GameCI

# on: [push, pull_request]
on:
  workflow_dispatch:

jobs:
  test:
    name: Test in ${{ matrix.testMode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - playmode
          # - editmode
          # - standalone
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # # For Support GameCI Issues
      # - name: Modifying Directory Structure
      #   run: |
      #     ls
      #     mkdir -p dev.limitex.mono-ui
      #     shopt -s extglob
      #     mv !(dev.limitex.mono-ui) dev.limitex.mono-ui/
      #     shopt -u extglob
      #     ls

      - name: Download & Unzip VRChat SDK Dependencies
        run: |
          # ワークフローの実行には jq と unzip が必要です
          sudo apt-get update && sudo apt-get install -y jq unzip

          # 1. VRChatの公式パッケージリストをダウンロード
          echo "Downloading VRChat package list..."
          curl -sL -H "User-Agent: ci/1.0" "https://packages.vrchat.com/official" -o official.json
          if [ ! -s official.json ]; then
            echo "::error::Failed to download official package list."
            exit 1
          fi

          # package.jsonの存在を確認
          if [ ! -f ./package.json ]; then
            echo "::error::File not found: ./package.json. This file is required in the root of your repository."
            exit 1
          fi

          # 依存関係のパッケージを展開するためのPackagesフォルダを作成
          mkdir -p Packages
          echo "Reading ./package.json to download and unzip dependencies..."
          
          # 2. vpmDependenciesを解析し、各パッケージをダウンロード・展開
          jq -r '.vpmDependencies | to_entries[] | "\(.key) \(.value)"' ./package.json | while read -r PKG_NAME VERSION_RANGE; do
            # バージョン情報（例: ">=3.8.2"）からバージョン番号（例: "3.8.2"）を抽出
            VERSION=$(echo "$VERSION_RANGE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            
            if [ -z "$VERSION" ]; then
              echo "::warning::Could not extract a valid version from '$VERSION_RANGE' for package '$PKG_NAME'. Skipping."
              continue
            fi

            echo "--> Processing package: '$PKG_NAME' version '$VERSION'"

            # ダウンロードURLを公式リストから取得
            DOWNLOAD_URL=$(jq -r --arg pkg "$PKG_NAME" --arg ver "$VERSION" '.repo.packages[$pkg].versions[$ver].url' official.json)

            if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
              echo "::error::Could not find download URL for package '$PKG_NAME' with version '$VERSION'."
              exit 1
            fi

            ZIP_FILENAME=$(basename "$DOWNLOAD_URL")
            TARGET_DIR="Packages/$PKG_NAME"

            echo "    Downloading $ZIP_FILENAME..."
            curl -sLO "$DOWNLOAD_URL"
            if [ $? -ne 0 ]; then
              echo "::error::Failed to download $ZIP_FILENAME"
              exit 1
            fi
            
            mkdir -p "$TARGET_DIR"
            echo "    Unzipping to $TARGET_DIR..."
            unzip -q "$ZIP_FILENAME" -d "$TARGET_DIR"
            if [ $? -ne 0 ]; then
              echo "::error::Failed to unzip $ZIP_FILENAME"
              exit 1
            fi

            # 不要になったzipファイルを削除
            rm "$ZIP_FILENAME"
            echo "    Done."
          done

          echo "All dependencies downloaded and placed in the Packages directory."
          echo "Final directory structure:"
          ls -R

      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        id: gameci
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          packageMode: true
          unityVersion: 2022.3.22f1
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results (${{ matrix.testMode }})
          path: ${{ steps.gameci.outputs.artifactsPath }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Coverage results (${{ matrix.testMode }})
          path: ${{ steps.gameci.outputs.coveragePath }}

